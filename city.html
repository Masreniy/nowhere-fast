<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nowhere Fast — Город</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="logo">Nowhere<span>Fast</span></a>
        <nav class="nav" aria-label="Основная навигация">
            <a href="index.html">Главная</a>
            <a href="index.html#cities">Города</a>
        </nav>
    </div>
</header>

<main>
    <div class="container city-hero">
        <a href="index.html" class="btn-back">← Назад к городам</a>
        <div id="city-content"></div>
    </div>

    <section class="section">
        <div class="container">
            <h2 class="section-title" style="text-align:left">📍 Места</h2>
            <p class="section-sub" style="text-align:left">
                У каждого места есть координаты и местное написание — то, что понимают
                навигатор и таксист
            </p>
            <div id="places-container"></div>
        </div>
    </section>

    <section class="section section-alt">
        <div class="container">
            <h2 class="section-title" style="text-align:left">🗺️ Готовые маршруты</h2>
            <p class="section-sub" style="text-align:left">Маршруты, собранные авторами</p>
            <div id="routes-container"></div>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="logo">Nowhere<span>Fast</span></div>
        <p>&copy; 2026 Сделано для путешественников.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/dom.js"></script>
<script src="assets/js/api.js"></script>
<script>
    (function () {
        'use strict';

        const dom = NF.dom;
        const params = new URLSearchParams(window.location.search);

        const DIFFICULTY = {
            easy: { label: '🟢 Лёгкий', css: 'badge-easy' },
            medium: { label: '🟡 Средний', css: 'badge-medium' },
            hard: { label: '🔴 Сложный', css: 'badge-hard' },
        };

        const PRICE = ['Бесплатно', '₽', '₽₽', '₽₽₽', '₽₽₽₽'];

        /**
         * Находит город по адресу страницы.
         *
         * Основной способ — ?id=<uuid>. Поиск по ?city=<название> оставлен для
         * старых ссылок: раньше страница работала только по имени, и такие
         * ссылки могли разойтись.
         *
         * Города по умолчанию нет. Раньше при отсутствии параметра открывался
         * захардкоженный Гуанчжоу — страница делала вид, что запрос удался.
         */
        async function resolveCity() {
            const id = params.get('id');
            if (id) return NF.api.getCityById(id);

            const name = params.get('city');
            if (name) return NF.api.getCityByName(name);

            return null;
        }

        function cityMeta(city) {
            const fields = [
                ['Валюта', city.currency],
                ['Язык', city.language],
                ['Часовой пояс', city.timezone],
                ['Виза', city.visa_info],
            ].filter(function (pair) { return dom.value(pair[1], '') !== ''; });

            if (fields.length === 0) return null;

            return dom.el('div', { class: 'city-meta' }, fields.map(function (pair) {
                return dom.el('div', { class: 'city-meta-item' }, [
                    dom.el('span', { class: 'label', text: pair[0] }),
                    dom.el('span', { class: 'value', text: pair[1] }),
                ]);
            }));
        }

        function renderCity(city) {
            const container = document.getElementById('city-content');

            document.title = city.name + ' — Nowhere Fast';

            dom.replace(container, [
                dom.el('h1', { text: city.name }),
                city.name_local ? dom.el('div', { class: 'name-local', text: city.name_local }) : null,
                dom.el('div', { class: 'country', text: dom.value(city.country, '📍 Страна не указана') }),
                dom.image(city.image_url, city.name),
                dom.el('p', { class: 'description', text: dom.value(city.description, 'Описание пока не добавлено') }),
                cityMeta(city),
            ]);
        }

        // --- Места ---------------------------------------------------------

        function placeCard(place) {
            const meta = [];
            if (place.category) meta.push(dom.el('span', { class: 'chip', text: place.category }));
            if (place.visit_minutes) {
                meta.push(dom.el('span', { class: 'chip', text: '⏱ ' + place.visit_minutes + ' мин' }));
            }
            if (place.price_level !== null && place.price_level !== undefined) {
                meta.push(dom.el('span', { class: 'chip', text: PRICE[place.price_level] || '' }));
            }

            return dom.el('div', { class: 'place-card' }, [
                dom.el('h3', { text: place.name }),
                // Местное написание показывается заметно: латиницу навигатор может не найти.
                place.name_local ? dom.el('div', { class: 'local', text: place.name_local }) : null,
                place.description ? dom.el('div', { class: 'desc', text: place.description }) : null,
                place.address_local
                    ? dom.el('div', { class: 'address', text: '📍 ' + place.address_local })
                    : (place.address ? dom.el('div', { class: 'address', text: '📍 ' + place.address }) : null),
                meta.length > 0 ? dom.el('div', { class: 'place-meta' }, meta) : null,
            ]);
        }

        async function loadPlaces(cityId) {
            const container = document.getElementById('places-container');
            dom.loading(container, 'Загружаем места…');

            try {
                const places = await NF.api.listPlaces(cityId);

                if (places.length === 0) {
                    dom.empty(container, 'Мест пока нет',
                        'Места добавляются через админку — с координатами и местным написанием.');
                    return;
                }

                dom.replace(container, dom.el('div', { class: 'places-grid' }, places.map(placeCard)));
            } catch (error) {
                dom.failure(container, 'Не удалось загрузить места этого города.', error);
            }
        }

        // --- Маршруты ------------------------------------------------------

        function activityItem(activity) {
            const place = activity.places;
            const name = place ? place.name : activity.name;
            const local = place ? place.name_local : null;
            const address = place ? place.address_local : activity.location;

            return dom.el('div', { class: 'activity-item' }, [
                dom.el('span', { class: 'order', text: activity.order_in_day + '.' }),
                dom.el('div', { class: 'info' }, [
                    dom.el('div', { class: 'name', text: dom.value(name, 'Без названия') }),
                    local ? dom.el('div', { class: 'local', text: local }) : null,
                    activity.description ? dom.el('div', { class: 'desc', text: activity.description }) : null,
                    address ? dom.el('div', { class: 'location', text: '📍 ' + address }) : null,
                ]),
            ]);
        }

        function routeDay(day) {
            const activities = day.route_template_activities || [];
            return dom.el('div', { class: 'route-day' }, [
                dom.el('div', {
                    class: 'day-title',
                    text: 'День ' + day.day_number + (day.name ? ': ' + day.name : ''),
                }),
                day.description ? dom.el('div', { class: 'day-desc', text: day.description }) : null,
                dom.el('div', {}, activities.map(activityItem)),
            ]);
        }

        function routeCard(route) {
            const difficulty = DIFFICULTY[route.difficulty] || DIFFICULTY.medium;
            const days = route.route_template_days || [];

            const badgeText = route.days_count
                ? difficulty.label + ' · ' + route.days_count + ' дн.'
                : difficulty.label;

            return dom.el('article', { class: 'route-card' }, [
                dom.el('div', { class: 'route-header' }, [
                    dom.el('h3', { text: route.name }),
                    dom.el('span', { class: 'badge ' + difficulty.css, text: badgeText }),
                ]),
                route.description ? dom.el('p', { text: route.description }) : null,
                days.length > 0 ? dom.el('div', { class: 'route-days' }, days.map(routeDay)) : null,
            ]);
        }

        async function loadRoutes(cityId) {
            const container = document.getElementById('routes-container');
            dom.loading(container, 'Загружаем маршруты…');

            try {
                const routes = await NF.api.listRoutes(cityId);

                if (routes.length === 0) {
                    dom.empty(container, 'Готовых маршрутов пока нет',
                        'Маршрут можно собрать самому из мест выше.');
                    return;
                }

                dom.replace(container, routes.map(routeCard));
            } catch (error) {
                dom.failure(container, 'Не удалось загрузить маршруты этого города.', error);
            }
        }

        // --- Запуск --------------------------------------------------------

        async function init() {
            const cityContainer = document.getElementById('city-content');
            dom.loading(cityContainer, 'Загружаем город…');

            let city;
            try {
                city = await resolveCity();
            } catch (error) {
                dom.failure(cityContainer, 'Не удалось загрузить город.', error);
                return;
            }

            if (!city) {
                // Название из адреса не подставляется в разметку как есть —
                // оно приходит от кого угодно и раньше давало отражённую XSS.
                dom.empty(cityContainer, '😕 Город не найден',
                    'Проверь ссылку или выбери город на главной.');
                dom.empty(document.getElementById('places-container'), 'Мест нет', null);
                dom.empty(document.getElementById('routes-container'), 'Маршрутов нет', null);
                return;
            }

            renderCity(city);

            // Места и маршруты независимы: одно не должно ждать другого.
            loadPlaces(city.id);
            loadRoutes(city.id);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
