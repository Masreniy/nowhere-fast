# Прогон тестов на стороне GitHub.
#
# Локальный хук .claude/hooks/run-tests-before-commit.sh срабатывает только у того,
# кто коммитит через Claude Code. Правка, сделанная мимо него — через веб-интерфейс
# GitHub, с другой машины или другим инструментом, — не проверяется никем,
# а сайт публикуется из main напрямую. Этот воркфлоу закрывает дыру:
# тесты гоняются на каждом pull request и на каждом push в main.

name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
